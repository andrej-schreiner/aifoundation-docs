# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main", "bun"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Hourly: the models table shows each model's reasoning_effort values from the
  # platform model datasheet, refreshed before every build (see scripts/fetch-model-parameters.mjs).
  schedule:
    - cron: "7 * * * *"

# GITHUB_TOKEN permissions: Pages deployment, plus pushing the refreshed datasheet snapshot.
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: install dependencies
        run: bun install
      # Refreshes src/data/reasoning-effort.json from the datasheet. On any
      # failure it leaves the committed file untouched, so the site keeps the
      # values of the last successful fetch.
      - name: refresh model datasheet snapshot
        id: snapshot
        run: |
          bun run datasheet
          if git diff --quiet -- src/data/reasoning-effort.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # A scheduled run only rebuilds when the snapshot changed; the deployed
      # site already shows the current values otherwise. Pushes and manual runs
      # always build.
      - name: build
        if: github.event_name != 'schedule' || steps.snapshot.outputs.changed == 'true'
        run: bun run build
      - name: Setup Pages
        if: github.event_name != 'schedule' || steps.snapshot.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: github.event_name != 'schedule' || steps.snapshot.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        if: github.event_name != 'schedule' || steps.snapshot.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      # main is protected: push the refreshed snapshot to a branch; the pull request is opened by hand
      # once and updated by every later push.
      - name: push refreshed datasheet snapshot
        if: steps.snapshot.outputs.changed == 'true' && github.ref_name == 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/datasheet-refresh
          git add src/data/reasoning-effort.json
          git commit -m "chore: refresh reasoning_effort values from model datasheet"
          git push --force origin chore/datasheet-refresh
          echo "Pull request: ${{ github.server_url }}/${{ github.repository }}/compare/main...chore/datasheet-refresh"
