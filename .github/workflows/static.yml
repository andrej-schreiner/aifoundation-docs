# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main", "bun"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Hourly: the models table shows each model's reasoning_effort values from the
  # platform model datasheet, refreshed before every build (see scripts/fetch-model-parameters.mjs).
  schedule:
    - cron: "7 * * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and
# to open a pull request with the refreshed datasheet snapshot (main is protected,
# so the bot cannot push to it directly).
permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: install dependencies
        run: bun install
      # Refreshes src/data/reasoning-effort.json from the datasheet. On any
      # failure it leaves the committed file untouched, so the site keeps the
      # values of the last successful fetch.
      - name: refresh model datasheet snapshot
        id: snapshot
        run: |
          bun run datasheet
          if git diff --quiet -- src/data/reasoning-effort.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # A scheduled run only rebuilds when the snapshot changed; the deployed
      # site already shows the current values otherwise. Pushes and manual runs
      # always build.
      - name: build
        if: github.event_name != 'schedule' || steps.snapshot.outputs.changed == 'true'
        run: bun run build
      - name: Setup Pages
        if: github.event_name != 'schedule' || steps.snapshot.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: github.event_name != 'schedule' || steps.snapshot.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        if: github.event_name != 'schedule' || steps.snapshot.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      # Persist the refreshed snapshot as the new "last known good" once it is
      # deployed. main only accepts changes through pull requests, so the bot
      # opens one (and updates the same PR on later runs) instead of pushing.
      # Until it is merged, each scheduled run sees the same diff and redeploys
      # the same values, which is harmless.
      - name: open pull request with refreshed datasheet snapshot
        if: steps.snapshot.outputs.changed == 'true' && github.ref_name == 'main'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: src/data/reasoning-effort.json
          commit-message: "chore: refresh reasoning_effort values from model datasheet"
          branch: chore/datasheet-refresh
          delete-branch: true
          title: "chore: refresh reasoning_effort values from model datasheet"
          body: |
            Automated refresh of `src/data/reasoning-effort.json` from the platform model datasheet
            (`/v1/datasheet/model-parameters`). The site was already deployed with these values by the
            run that opened this pull request; merging keeps the repository in step with it.
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
